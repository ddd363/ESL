<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        color: #202735;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #recorder {
        padding: 4px 0 8px;
      }
      #controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }
      #start, #pause, #stop {
        min-width: 140px;
        min-height: 40px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }
      #start {
        background: #166e55;
        color: #ffffff;
      }
      #start:hover, #start:focus-visible {
        background: #0f5743;
      }
      #pause {
        background: #b7791f;
        color: #ffffff;
      }
      #stop {
        background: #c4321c;
        color: #ffffff;
      }
      #start:disabled, #pause:disabled, #stop:disabled {
        background: #d8dde5;
        color: #596273;
        cursor: not-allowed;
      }
      #start:focus-visible, #pause:focus-visible, #stop:focus-visible,
      select:focus-visible, input:focus-visible {
        outline: 3px solid #175cd3;
        outline-offset: 2px;
      }
      #status {
        color: #384152;
        font-size: 14px;
        font-weight: 600;
      }
      #recorder.paused #status {
        color: #b7791f;
      }
      #deviceRow {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
        margin-top: 8px;
      }
      .input-party {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        gap: 6px 8px;
      }
      .input-party select {
        width: min(100%, 240px);
        max-width: 100%;
      }
      .input-party label[for$="Enabled"] {
        grid-column: 1 / -1;
        font-size: 13px;
      }
      .loopback-toggle {
        grid-column: 1 / -1;
        font-size: 13px;
      }
      .mic-mode {
        grid-column: 1 / -1;
        font-size: 12px;
        color: #596273;
      }
      .mic-mode.loopback {
        color: #0f5743;
        font-weight: 600;
      }
      #waveformRow {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .waveform-block {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .waveform-label {
        font-size: 12px;
        font-weight: 700;
        color: #384152;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .waveform-block canvas {
        width: min(100%, 260px);
        background: #eef3f2;
        border-radius: 6px;
      }
      #recorder:not(.recording):not(.paused) #waveformRow {
        display: none;
      }
      #error {
        color: #b00020;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="recorder">
      <div id="controls">
        <button id="start" type="button">Start lesson</button>
        <button id="pause" type="button" aria-keyshortcuts="Space" disabled>Pause</button>
        <button id="stop" type="button" disabled>End lesson</button>
        <span id="status" role="status" aria-live="polite">Ready to start</span>
      </div>
      <div id="deviceRow">
        <div class="input-party">
          <label for="studentMicrophone">Student microphone</label>
          <select id="studentMicrophone"><option value="">Default microphone</option></select>
          <label for="studentLoopback" class="loopback-toggle"><input id="studentLoopback" type="checkbox"> System audio (no echo cancellation)</label>
          <span class="mic-mode" id="studentMode"></span>
        </div>
        <div class="input-party">
          <label for="teacherMicrophone">Teacher microphone</label>
          <select id="teacherMicrophone"><option value="">Default microphone</option></select>
          <label for="teacherLoopback" class="loopback-toggle"><input id="teacherLoopback" type="checkbox"> System audio (no echo cancellation)</label>
          <span class="mic-mode" id="teacherMode"></span>
        </div>
      </div>
      <div id="waveformRow">
        <div class="waveform-block">
          <span class="waveform-label">Student</span>
          <canvas id="waveformStudent" width="520" height="70"></canvas>
        </div>
        <div class="waveform-block">
          <span class="waveform-label">Teacher</span>
          <canvas id="waveformTeacher" width="520" height="70"></canvas>
        </div>
      </div>
      <div id="deviceWarning" style="color: #b7791f; font-weight: 600; font-size: 13px; margin-top: 6px; display: none;"></div>
      <div id="error"></div>
    </div>
    <script>
      const streamlitBridge = (() => {
        if (window.Streamlit) {
          return window.Streamlit;
        }

        const post = (type, payload = {}) => {
          window.parent.postMessage(
            {
              isStreamlitMessage: true,
              type,
              ...payload,
            },
            "*"
          );
        };

        return {
          setComponentReady() {
            post("streamlit:componentReady", { apiVersion: 1 });
          },
          setFrameHeight(height) {
            post("streamlit:setFrameHeight", {
              height: height || document.documentElement.scrollHeight || 220,
            });
          },
          setComponentValue(value) {
            post("streamlit:setComponentValue", { value });
          },
        };
      })();

      const startBtn = document.getElementById("start");
      const pauseBtn = document.getElementById("pause");
      const stopBtn = document.getElementById("stop");
      const recorderEl = document.getElementById("recorder");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const studentMicrophoneSelect = document.getElementById("studentMicrophone");
      const teacherMicrophoneSelect = document.getElementById("teacherMicrophone");
      const studentEnabledInput = document.getElementById("studentEnabled");
      const teacherEnabledInput = document.getElementById("teacherEnabled");
      const waveforms = {
        student: document.getElementById("waveformStudent").getContext("2d"),
        teacher: document.getElementById("waveformTeacher").getContext("2d"),
      };

      const sources = {
        // "preferred" patterns are tried in order; "avoid" always excludes a device
        // (e.g. aggregate/multi-output devices, which must never be auto-picked).
        student: { label: "Student", select: studentMicrophoneSelect, preferred: [/blackhole\s*2\s*ch/i, /blackhole/i], avoid: /aggregate|multi[- ]?output/i, modeEl: document.getElementById("studentMode"), loopbackEl: document.getElementById("studentLoopback") },
        teacher: { label: "Teacher", select: teacherMicrophoneSelect, preferred: [/macbook air|built-in|internal/i], avoid: /blackhole|aggregate|multi[- ]?output/i, modeEl: document.getElementById("teacherMode"), loopbackEl: document.getElementById("teacherLoopback") },
      };
      // Virtual/loopback inputs carry system audio rather than room sound.
      // Chrome's echo canceller subtracts the browser's OWN playback from the
      // capture, which silences anything played in this browser and routed back
      // through the loopback device. Browser processing must be off for these.
      const LOOPBACK_DEVICE_PATTERN = /blackhole|loopback|soundflower|virtual|aggregate|multi-output|vb-?cable/i;
      let animationId = null;
      // Lesson state machine: idle -> recording <-> paused -> idle (after End).
      let lessonState = "idle";
      let timerIntervalId = null;
      // Active (unpaused) lesson time, accumulated across pauses.
      let activeMs = 0;
      let lastResumeMs = null;
      // 0.5 s keeps chunks responsive
      const LIVE_CHUNK_INTERVAL_SECONDS = 0.5;
      const INGESTION_SERVER_URL = "http://127.0.0.1:8765";
      // MediaRecorder timeslice: hand back compressed chunks regularly so a
      // whole lesson never sits in one giant buffer.
      const MEDIA_RECORDER_TIMESLICE_MS = 5000;

      const WORKLET_CODE = `
      class PcmCaptureProcessor extends AudioWorkletProcessor {
        process(inputs) {
          const input = inputs[0];
          if (input && input[0] && input[0].length > 0) {
            this.port.postMessage(input[0]);
          }
          return true;
        }
      }
      registerProcessor('pcm-capture-processor', PcmCaptureProcessor);
      `;
      let workletBlobUrl = null;
      try {
        const blob = new Blob([WORKLET_CODE], { type: "application/javascript" });
        workletBlobUrl = URL.createObjectURL(blob);
      } catch (e) {
        console.warn("Could not create AudioWorklet Blob URL:", e);
      }

      for (const source of Object.values(sources)) {
        source.selectedDeviceId = "";
        source.selectedDeviceLabel = "";
        source.isLoopback = false;
        source.loopbackTouched = false;
        source.audioContext = null;
        source.mediaStream = null;
        source.processor = null;
        source.workletNode = null;
        source.captureMode = "audio_worklet";
        source.input = null;
        source.analyser = null;
        source.waveReference = 0;
        source.ready = false;
        source.initPromise = null;
        source.liveChunkBuffers = [];
        source.liveChunkSamples = 0;
        source.liveChunkSeq = 0;
        source.outboxQueue = [];
        source.isDraining = false;
        source.consecutiveFailures = 0;
        source.mediaRecorder = null;
        source.mediaChunks = [];
        source.mediaMimeType = "";
      }

      function setUiState() {
        for (const source of Object.values(sources)) {
          source.select.disabled = lessonState !== "idle";
          if (source.loopbackEl) {
            source.loopbackEl.disabled = lessonState !== "idle";
          }
        }
        recorderEl.classList.toggle("recording", lessonState === "recording");
        recorderEl.classList.toggle("paused", lessonState === "paused");
        startBtn.disabled = lessonState !== "idle";
        pauseBtn.disabled = lessonState !== "recording" && lessonState !== "paused";
        stopBtn.disabled = lessonState !== "recording" && lessonState !== "paused";
        pauseBtn.textContent = lessonState === "paused" ? "Resume" : "Pause";
      }

      function emitEvent(eventName, extra = {}) {
        try {
          streamlitBridge.setComponentValue({
            event: eventName,
            t: Date.now(),
            ...extra,
          });
        } catch (err) {
          // ignore event emission failures
        }
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function formatElapsed(totalSeconds) {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;
        const ms = `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
        return h > 0 ? `${h}:${ms}` : ms;
      }

      function currentActiveMs() {
        let total = activeMs;
        if (lessonState === "recording" && lastResumeMs !== null) {
          total += Date.now() - lastResumeMs;
        }
        return total;
      }

      function updateTimerStatus() {
        const elapsed = Math.max(0, Math.floor(currentActiveMs() / 1000));
        if (lessonState === "recording") {
          setStatus(`Recording lesson... ${formatElapsed(elapsed)}`);
        } else if (lessonState === "paused") {
          setStatus(`Paused at ${formatElapsed(elapsed)}`);
        }
      }

      function startTimer() {
        stopTimer();
        timerIntervalId = setInterval(updateTimerStatus, 250);
      }

      function stopTimer() {
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
      }

      function clearWaveform() {
        for (const waveCtx of Object.values(waveforms)) {
          waveCtx.fillStyle = "#f6f7f8";
          waveCtx.fillRect(0, 0, waveCtx.canvas.width, waveCtx.canvas.height);
        }
      }

      function cleanupSource(source) {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        if (source.mediaRecorder) {
          try {
            if (source.mediaRecorder.state !== "inactive") {
              source.mediaRecorder.stop();
            }
          } catch (err) {
            // ignore
          }
          source.mediaRecorder = null;
        }
        if (source.processor) {
          try {
            source.processor.disconnect();
          } catch (err) {
            // ignore
          }
          source.processor = null;
        }
        if (source.workletNode) {
          try {
            source.workletNode.disconnect();
          } catch (err) {
            // ignore
          }
          source.workletNode = null;
        }
        if (source.analyser) {
          try {
            source.analyser.disconnect();
          } catch (err) {
            // ignore
          }
          source.analyser = null;
          source.waveReference = 0;
        }
        if (source.input) {
          try {
            source.input.disconnect();
          } catch (err) {
            // ignore
          }
          source.input = null;
        }
        if (source.mediaStream) {
          source.mediaStream.getTracks().forEach((track) => {
            try {
              track.stop();
            } catch (err) {
              // ignore
            }
          });
          source.mediaStream = null;
        }
        if (source.audioContext) {
          try {
            source.audioContext.close();
          } catch (err) {
            // ignore
          }
          source.audioContext = null;
        }
        source.ready = false;
        source.initPromise = null;
      }

      function loadSavedPreferences() {
        try {
          for (const [sourceName, source] of Object.entries(sources)) {
            const savedId = localStorage.getItem(`esl_${sourceName}_mic`);
            if (savedId !== null) {
              source.selectedDeviceId = savedId;
            }
            const savedLoop = localStorage.getItem(`esl_${sourceName}_loopback`);
            if (savedLoop !== null && source.loopbackEl) {
              source.loopbackEl.checked = savedLoop === "true";
              source.loopbackTouched = true;
            }
          }
        } catch (e) {
          // localStorage might be unavailable in some iframe sandboxes
        }
      }

      function checkDeviceConflicts() {
        const studentId = sources.student.selectedDeviceId;
        const teacherId = sources.teacher.selectedDeviceId;
        const warningEl = document.getElementById("deviceWarning");
        if (!warningEl) return;
        if (studentId && teacherId && studentId === teacherId) {
          warningEl.style.display = "block";
          warningEl.textContent = "⚠️ Warning: Student and Teacher are assigned to the same audio device. Choose separate devices to prevent audio crossover.";
        } else {
          warningEl.style.display = "none";
          warningEl.textContent = "";
        }
      }

      function setMicOptions(source, devices) {
        const sourceKey = source === sources.student ? "student" : "teacher";
        const previousValue = source.selectedDeviceId || source.select.value || "";
        source.select.innerHTML = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        source.select.appendChild(defaultOption);

        devices.forEach((device, idx) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${idx + 1}`;
          source.select.appendChild(option);
        });

        const hasPrevious = devices.some((device) => device.deviceId === previousValue && previousValue !== "");
        let nextValue = hasPrevious ? previousValue : "";
        if (!nextValue && source.preferred) {
          for (const pattern of source.preferred) {
            const preferredDevice = devices.find(
              (device) =>
                pattern.test(device.label || "")
                && !(source.avoid && source.avoid.test(device.label || ""))
            );
            if (preferredDevice) {
              nextValue = preferredDevice.deviceId;
              break;
            }
          }
        }

        source.selectedDeviceId = nextValue;
        source.select.value = source.selectedDeviceId;
        const selectedDevice = devices.find((device) => device.deviceId === nextValue);
        source.selectedDeviceLabel = selectedDevice ? selectedDevice.label || "" : "";
        updateModeHint(source);
      }

      function updateModeHint(source) {
        // Device labels are blank until mic permission is granted, so auto-detection
        // can only advise. Never override a choice the user made by hand.
        if (source.loopbackEl && !source.loopbackTouched) {
          const detected = LOOPBACK_DEVICE_PATTERN.test(source.selectedDeviceLabel || "");
          if (detected) {
            source.loopbackEl.checked = true;
          }
        }
        if (!source.modeEl) {
          return;
        }
        const isLoopback = Boolean(source.loopbackEl && source.loopbackEl.checked);
        source.modeEl.classList.toggle("loopback", isLoopback);
        source.modeEl.textContent = isLoopback
          ? "System audio mode — browser processing off"
          : "Room mic mode — echo cancellation on";
      }

      async function refreshMicrophones(promptPermission = false) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return;
        }
        try {
          let devices = await navigator.mediaDevices.enumerateDevices();
          let microphones = devices.filter((device) => device.kind === "audioinput");

          // If device labels are blank (permission not yet granted), request a quick stream to unlock labels
          const hasEmptyLabels = microphones.length > 0 && !microphones.some((d) => d.label);
          if ((promptPermission || hasEmptyLabels) && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              stream.getTracks().forEach((track) => track.stop());
              devices = await navigator.mediaDevices.enumerateDevices();
              microphones = devices.filter((device) => device.kind === "audioinput");
            } catch (err) {
              console.warn("Could not request mic permissions for device enumeration:", err);
            }
          }

          loadSavedPreferences();

          for (const source of Object.values(sources)) {
            setMicOptions(source, microphones);
          }

          // De-duplication guard: If multiple distinct physical/virtual mics exist,
          // ensure Student and Teacher do not default to the exact same device.
          if (microphones.length > 1) {
            if (
              sources.student.selectedDeviceId === sources.teacher.selectedDeviceId ||
              (!sources.student.selectedDeviceId && !sources.teacher.selectedDeviceId)
            ) {
              const studentMatch = microphones.find((d) =>
                sources.student.preferred && sources.student.preferred.some((p) => p.test(d.label || ""))
              );
              const teacherMatch = microphones.find((d) =>
                sources.teacher.preferred && sources.teacher.preferred.some((p) => p.test(d.label || "")) &&
                !(studentMatch && d.deviceId === studentMatch.deviceId)
              );

              if (studentMatch && teacherMatch && studentMatch.deviceId !== teacherMatch.deviceId) {
                if (!sources.student.selectedDeviceId || sources.student.selectedDeviceId === sources.teacher.selectedDeviceId) {
                  sources.student.selectedDeviceId = studentMatch.deviceId;
                  sources.student.select.value = studentMatch.deviceId;
                  sources.student.selectedDeviceLabel = studentMatch.label || "";
                  updateModeHint(sources.student);
                }
                if (!sources.teacher.selectedDeviceId || sources.teacher.selectedDeviceId === sources.student.selectedDeviceId) {
                  sources.teacher.selectedDeviceId = teacherMatch.deviceId;
                  sources.teacher.select.value = teacherMatch.deviceId;
                  sources.teacher.selectedDeviceLabel = teacherMatch.label || "";
                  updateModeHint(sources.teacher);
                }
              }
            }
          }

          checkDeviceConflicts();

          emitEvent("microphones_listed", {
            count: microphones.length,
            student_device_id: sources.student.selectedDeviceId || null,
            teacher_device_id: sources.teacher.selectedDeviceId || null,
          });
        } catch (err) {
          emitEvent("microphones_list_error", { message: String(err) });
        }
      }

      // This meter answers exactly one question: is audio coming through? Nobody
      // reads the shape. A fixed gain cannot do that job, because the incoming
      // level depends entirely on the mic and the system volume - a loopback
      // device at half volume peaks near 0.01, where any fixed scaling either
      // shows nothing or pins on room tone.
      //
      // So it self-scales: whatever the loudest thing heard recently was becomes
      // full height. Any real audio therefore fills the canvas, at any input
      // level, and silence is the only thing that draws flat.
      const WAVE_SILENCE = 0.0015;  // frame peak below this = genuine silence
      const WAVE_MIN_REF = 0.012;   // never scale quieter than this up to full
      const WAVE_REF_DECAY = 0.985; // how fast the reference falls back (per frame)
      const WAVE_CURVE = 0.5;       // below 1 fattens the body of the envelope
      const WAVE_COLUMN_PX = 4;     // canvas px per peak column
      const WAVE_COLORS = {
        student: { line: "#166e55", fill: "rgba(22, 110, 85, 0.32)" },
        teacher: { line: "#175cd3", fill: "rgba(23, 92, 211, 0.30)" },
      };

      function waveAmplitude(peak, reference) {
        if (peak <= 0 || reference <= 0) {
          return 0;
        }
        return Math.min(1, Math.pow(peak / reference, WAVE_CURVE));
      }

      function drawWaveform() {
        try {
          paintWaveforms();
        } catch (err) {
          if (!window.__waveformErrorReported) {
            window.__waveformErrorReported = true;
            emitEvent("waveform_error", { message: String(err) });
          }
        }
        animationId = requestAnimationFrame(drawWaveform);
      }

      function paintWaveforms() {
        for (const [sourceName, waveCtx] of Object.entries(waveforms)) {
          const source = sources[sourceName];
          const waveCanvas = waveCtx.canvas;
          const mid = waveCanvas.height / 2;
          const colors = WAVE_COLORS[sourceName] || WAVE_COLORS.student;
          waveCtx.fillStyle = "#f6f7f8";
          waveCtx.fillRect(0, 0, waveCanvas.width, waveCanvas.height);

          // Always draw the baseline, so an idle mic reads as quiet rather than
          // as a dead widget.
          waveCtx.lineWidth = 1;
          waveCtx.strokeStyle = "#d8dee5";
          waveCtx.beginPath();
          waveCtx.moveTo(0, mid);
          waveCtx.lineTo(waveCanvas.width, mid);
          waveCtx.stroke();

          if (!source.analyser || !source.ready) {
            continue;
          }
          // Float, not byte: getByteTimeDomainData quantises to 8 bits, so the
          // smallest deflection it can express is 1/128 - coarser than the quiet
          // signals this meter most needs to show.
          const bufferLength = source.analyser.fftSize;
          const dataArray = new Float32Array(bufferLength);
          source.analyser.getFloatTimeDomainData(dataArray);

          // One peak per column. At 260 CSS px a 2048-point trace just aliases
          // into mush; a peak envelope is legible at a glance.
          const columns = Math.max(1, Math.floor(waveCanvas.width / WAVE_COLUMN_PX));
          const perColumn = Math.max(1, Math.floor(bufferLength / columns));
          const maxAmp = mid - 2;
          const peaks = new Array(columns);
          let framePeak = 0;
          for (let c = 0; c < columns; c += 1) {
            const start = c * perColumn;
            const end = Math.min(bufferLength, start + perColumn);
            let peak = 0;
            for (let i = start; i < end; i += 1) {
              const deviation = Math.abs(dataArray[i]);
              if (deviation > peak) {
                peak = deviation;
              }
            }
            peaks[c] = peak;
            if (peak > framePeak) {
              framePeak = peak;
            }
          }

          // Instant attack, slow release: the loudest thing heard in the last
          // second or two defines full height.
          source.waveReference = Math.max(framePeak, (source.waveReference || 0) * WAVE_REF_DECAY);
          if (framePeak < WAVE_SILENCE) {
            continue;  // nothing coming through; the baseline already says so
          }
          const reference = Math.max(source.waveReference, WAVE_MIN_REF);
          const heights = peaks.map((peak) => waveAmplitude(peak, reference) * maxAmp);

          const columnX = (c) => c * WAVE_COLUMN_PX + WAVE_COLUMN_PX / 2;
          waveCtx.beginPath();
          waveCtx.moveTo(columnX(0), mid - heights[0]);
          for (let c = 1; c < columns; c += 1) {
            waveCtx.lineTo(columnX(c), mid - heights[c]);
          }
          for (let c = columns - 1; c >= 0; c -= 1) {
            waveCtx.lineTo(columnX(c), mid + heights[c]);
          }
          waveCtx.closePath();
          waveCtx.fillStyle = colors.fill;
          waveCtx.fill();
          waveCtx.lineWidth = 2;
          waveCtx.lineJoin = "round";
          waveCtx.strokeStyle = colors.line;
          waveCtx.stroke();
        }
      }

      function pickMediaRecorderMime() {
        if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) {
          return "";
        }
        const candidates = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/mp4",
          "audio/ogg;codecs=opus",
        ];
        return candidates.find((mime) => MediaRecorder.isTypeSupported(mime)) || "";
      }

      function startMediaRecorder(source) {
        if (typeof MediaRecorder === "undefined" || !source.mediaStream) {
          return;
        }
        try {
          const mime = pickMediaRecorderMime();
          const options = mime ? { mimeType: mime, audioBitsPerSecond: 64000 } : { audioBitsPerSecond: 64000 };
          source.mediaChunks = [];
          source.mediaRecorder = new MediaRecorder(source.mediaStream, options);
          source.mediaMimeType = source.mediaRecorder.mimeType || mime || "audio/webm";
          source.mediaRecorder.ondataavailable = (event) => {
            if (event.data && event.data.size > 0) {
              source.mediaChunks.push(event.data);
            }
          };
          source.mediaRecorder.start(MEDIA_RECORDER_TIMESLICE_MS);
        } catch (err) {
          source.mediaRecorder = null;
          emitEvent("media_recorder_error", { message: String(err) });
        }
      }

      async function initSource(sourceName) {
        const source = sources[sourceName];
        if (source.ready) {
          return;
        }
        if (source.initPromise) {
          return source.initPromise;
        }
        errorEl.textContent = "";
        source.initPromise = (async () => {
          try {
            // Verify device options are populated with valid labels before opening stream
            if (!source.selectedDeviceId || !source.selectedDeviceLabel) {
              await refreshMicrophones(true);
            }

            setStatus(`Requesting ${source.label.toLowerCase()} microphone...`);
            const isLoopback = Boolean(source.loopbackEl && source.loopbackEl.checked);
            const audioConstraints = {};
            if (source.selectedDeviceId) {
              audioConstraints.deviceId = { exact: source.selectedDeviceId };
            }
            if (isLoopback) {
              // Without these, Chrome cancels out audio this browser is playing.
              audioConstraints.echoCancellation = false;
              audioConstraints.noiseSuppression = false;
              audioConstraints.autoGainControl = false;
            }
            source.isLoopback = isLoopback;
            source.mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
            source.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (source.audioContext.state === "suspended") {
              await source.audioContext.resume();
            }
            source.input = source.audioContext.createMediaStreamSource(source.mediaStream);
            source.analyser = source.audioContext.createAnalyser();
            source.analyser.fftSize = 2048;

            let captureMode = "script_processor";
            if (source.audioContext.audioWorklet && workletBlobUrl) {
              try {
                await source.audioContext.audioWorklet.addModule(workletBlobUrl);
                source.workletNode = new AudioWorkletNode(source.audioContext, "pcm-capture-processor");
                source.workletNode.port.onmessage = (event) => {
                  if (lessonState !== "recording") {
                    return;
                  }
                  const chunk = new Float32Array(event.data);
                  source.liveChunkBuffers.push(chunk);
                  source.liveChunkSamples += chunk.length;
                  flushLiveChunk(sourceName, false);
                };
                source.input.connect(source.analyser);
                source.analyser.connect(source.workletNode);
                const muteGain = source.audioContext.createGain();
                muteGain.gain.value = 0;
                source.workletNode.connect(muteGain);
                muteGain.connect(source.audioContext.destination);
                captureMode = "audio_worklet";
              } catch (err) {
                console.warn(`AudioWorklet fallback for ${sourceName}:`, err);
              }
            }

            if (captureMode === "script_processor") {
              source.processor = source.audioContext.createScriptProcessor(4096, 1, 1);
              source.processor.onaudioprocess = (event) => {
                if (lessonState !== "recording") {
                  return;
                }
                const channel = event.inputBuffer.getChannelData(0);
                const chunk = new Float32Array(channel);
                source.liveChunkBuffers.push(chunk);
                source.liveChunkSamples += chunk.length;
                flushLiveChunk(sourceName, false);
              };
              source.input.connect(source.analyser);
              source.analyser.connect(source.processor);
              source.processor.connect(source.audioContext.destination);
            }
            source.captureMode = captureMode;
            source.ready = true;
            setStatus("Ready");
            await refreshMicrophones();
            emitEvent("mic_ready", {
              source: sourceName,
              sample_rate: source.audioContext.sampleRate,
              device_label: source.selectedDeviceLabel || "default",
              loopback_mode: isLoopback,
              capture_mode: captureMode,
            });
          } catch (err) {
            errorEl.textContent = `${source.label} microphone access denied or unavailable.`;
            setStatus("Not recording");
            emitEvent("mic_error", { source: sourceName, message: String(err) });
            cleanupSource(source);
          }
        })();
        return source.initPromise;
      }

      function mergeBuffers(chunks) {
        let length = 0;
        chunks.forEach((c) => {
          length += c.length;
        });
        const result = new Float32Array(length);
        let offset = 0;
        chunks.forEach((c) => {
          result.set(c, offset);
          offset += c.length;
        });
        return result;
      }

      function float32ToPcm16Bytes(samples) {
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i += 1) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return new Uint8Array(pcm.buffer);
      }

      async function drainOutbox(sourceName) {
        const source = sources[sourceName];
        if (source.isDraining) {
          return;
        }
        source.isDraining = true;
        while (source.outboxQueue.length > 0 && lessonState === "recording") {
          const item = source.outboxQueue[0];
          try {
            const resp = await fetch(`${INGESTION_SERVER_URL}/chunk`, {
              method: "POST",
              headers: {
                "Content-Type": "application/octet-stream",
                "X-Track-Id": sourceName,
                "X-Seq": String(item.seq),
                "X-Sample-Rate": String(item.sampleRate),
                "X-Timestamp": String(item.timestamp),
              },
              body: item.data,
            });
            if (resp.ok) {
              source.outboxQueue.shift();
              source.consecutiveFailures = 0;
            } else {
              source.consecutiveFailures = (source.consecutiveFailures || 0) + 1;
              if (source.consecutiveFailures > 5) {
                setStatus("Audio server connection degraded... Retrying");
              }
              await new Promise((r) => setTimeout(r, 400));
            }
          } catch (err) {
            console.warn(`[AudioRecorder] Ingestion POST /chunk failed for ${sourceName}:`, err);
            source.consecutiveFailures = (source.consecutiveFailures || 0) + 1;
            if (source.consecutiveFailures > 5) {
              setStatus("Audio server unreachable... Buffering");
              if (source.consecutiveFailures === 6) {
                emitEvent("recorder_error", {
                  message: `Audio ingestion server on ${INGESTION_SERVER_URL} unreachable. Chunks buffered in memory.`,
                });
              }
            }
            await new Promise((r) => setTimeout(r, 500));
          }
        }
        source.isDraining = false;
      }

      function flushLiveChunk(sourceName, force = false) {
        const source = sources[sourceName];
        if (!source.audioContext) {
          return;
        }
        const sampleRate = source.audioContext.sampleRate || 44100;
        const thresholdSamples = Math.max(1, Math.floor(sampleRate * LIVE_CHUNK_INTERVAL_SECONDS));
        if (!force && source.liveChunkSamples < thresholdSamples) {
          return;
        }
        if (!source.liveChunkBuffers.length) {
          return;
        }
        const merged = mergeBuffers(source.liveChunkBuffers);
        const pcm16 = float32ToPcm16Bytes(merged);
        source.liveChunkBuffers = [];
        source.liveChunkSamples = 0;
        if (!pcm16.length) {
          return;
        }
        // Cap outbox queue at 60 items (30 seconds of audio)
        if (source.outboxQueue.length >= 60) {
          source.outboxQueue.shift();
        }
        source.outboxQueue.push({
          seq: source.liveChunkSeq,
          data: pcm16,
          sampleRate: sampleRate,
          timestamp: Date.now(),
        });
        source.liveChunkSeq += 1;
        drainOutbox(sourceName);
      }

      function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(reader.error);
          reader.onload = () => {
            const result = String(reader.result || "");
            const commaAt = result.indexOf(",");
            resolve(commaAt >= 0 ? result.slice(commaAt + 1) : result);
          };
          reader.readAsDataURL(blob);
        });
      }

      function stopMediaRecorder(source) {
        return new Promise((resolve) => {
          const recorder = source.mediaRecorder;
          if (!recorder || recorder.state === "inactive") {
            resolve();
            return;
          }
          let resolved = false;
          const done = () => {
            if (!resolved) {
              resolved = true;
              resolve();
            }
          };
          recorder.onstop = done;
          const timeout = setTimeout(done, 1500);
          try {
            recorder.stop();
          } catch (err) {
            clearTimeout(timeout);
            done();
          }
        });
      }

      async function startLesson() {
        if (lessonState !== "idle") {
          return;
        }
        // Both microphones always record and transcribe. Who is *shown* in the
        // on-screen transcript is a display filter in the app, not a capture setting.
        const allSources = Object.entries(sources);
        for (const [, source] of allSources) {
          source.liveChunkBuffers = [];
          source.liveChunkSamples = 0;
          source.liveChunkSeq = 0;
          source.outboxQueue = [];
          source.mediaChunks = [];
        }
        errorEl.textContent = "";
        try {
          await Promise.all(allSources.map(([sourceName]) => initSource(sourceName)));
          const activeSources = allSources.filter(([, source]) => source.ready);
          if (!activeSources.length) {
            throw new Error("No microphone could be opened.");
          }
          // One mic failing must not cost you the whole lesson.
          const failed = allSources.filter(([, source]) => !source.ready).map(([name]) => sources[name].label);
          errorEl.textContent = failed.length
            ? `Recording without the ${failed.join(" and ")} microphone — it could not be opened.`
            : "";
          for (const [, source] of activeSources) {
            if (source.audioContext && source.audioContext.state === "suspended") {
              await source.audioContext.resume();
            }
            startMediaRecorder(source);
          }
          lessonState = "recording";
          activeMs = 0;
          lastResumeMs = Date.now();
          setUiState();
          setStatus("Recording lesson... 00:00");
          startTimer();

          // Notify HTTP Ingestion Daemon
          const sourcesConfig = Object.fromEntries(
            activeSources.map(([sourceName, source]) => [sourceName, source.audioContext.sampleRate])
          );
          const activeModes = activeSources.map(([, s]) => s.captureMode || "script_processor");
          const modeUsed = activeModes.includes("audio_worklet") ? "audio_worklet" : "script_processor";

          fetch(`${INGESTION_SERVER_URL}/lesson/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              capture_mode: modeUsed,
              sources: sourcesConfig,
            }),
          }).catch((err) => console.warn("Could not notify ingestion server of start:", err));

          try {
            drawWaveform();
          } catch (err) {
            emitEvent("waveform_error", { message: String(err) });
          }
          emitEvent("lesson_started", {
            sources: sourcesConfig,
            capture_mode: modeUsed,
          });
        } catch (err) {
          errorEl.textContent = "Microphone access denied or unavailable.";
          setStatus("Not recording");
          lessonState = "idle";
          setUiState();
          emitEvent("lesson_start_error", { message: String(err) });
        }
      }

      function pauseLesson() {
        if (lessonState !== "recording") {
          return;
        }
        for (const [sourceName, source] of Object.entries(sources)) {
          if (source.ready) {
            flushLiveChunk(sourceName, true);
            if (source.mediaRecorder && source.mediaRecorder.state === "recording") {
              try {
                source.mediaRecorder.pause();
              } catch (err) {
                // ignore
              }
            }
          }
        }
        activeMs = currentActiveMs();
        lastResumeMs = null;
        lessonState = "paused";
        setUiState();
        updateTimerStatus();

        fetch(`${INGESTION_SERVER_URL}/lesson/pause`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        }).catch((err) => console.warn("Could not notify ingestion server of pause:", err));

        emitEvent("lesson_paused", { active_seconds: Math.floor(activeMs / 1000) });
      }

      function resumeLesson() {
        if (lessonState !== "paused") {
          return;
        }
        for (const source of Object.values(sources)) {
          if (source.ready && source.mediaRecorder && source.mediaRecorder.state === "paused") {
            try {
              source.mediaRecorder.resume();
            } catch (err) {
              // ignore
            }
          }
        }
        lastResumeMs = Date.now();
        lessonState = "recording";
        setUiState();
        updateTimerStatus();

        fetch(`${INGESTION_SERVER_URL}/lesson/resume`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        }).catch((err) => console.warn("Could not notify ingestion server of resume:", err));

        emitEvent("lesson_resumed", { active_seconds: Math.floor(activeMs / 1000) });
      }

      async function endLesson() {
        if (lessonState !== "recording" && lessonState !== "paused") {
          return;
        }
        const activeSources = Object.entries(sources).filter(([, source]) => source.ready);
        const totalActiveSeconds = Math.floor(currentActiveMs() / 1000);
        lessonState = "idle";
        stopTimer();
        activeMs = 0;
        lastResumeMs = null;
        setUiState();
        setStatus("Saving lesson...");
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        for (const [sourceName] of activeSources) {
          flushLiveChunk(sourceName, true);
        }
        clearWaveform();

        fetch(`${INGESTION_SERVER_URL}/lesson/end`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        }).catch((err) => console.warn("Could not notify ingestion server of end:", err));

        const audioPayload = {};
        try {
          for (const [sourceName, source] of activeSources) {
            await stopMediaRecorder(source);
            if (source.mediaChunks.length) {
              const blob = new Blob(source.mediaChunks, { type: source.mediaMimeType || "audio/webm" });
              // Guard: omit giant base64 payloads to avoid freezing/disconnecting Streamlit WebSocket;
              // server-side TrackRecorder already continuously records full Ogg/Opus audio to disk.
              if (blob.size <= 10 * 1024 * 1024) {
                try {
                  audioPayload[sourceName] = {
                    b64: await blobToBase64(blob),
                    mime: source.mediaMimeType || "audio/webm",
                    bytes: blob.size,
                  };
                } catch (err) {
                  emitEvent("lesson_audio_encode_error", { source: sourceName, message: String(err) });
                }
              }
            }
            source.mediaChunks = [];
          }
        } finally {
          for (const [, source] of Object.entries(sources)) {
            cleanupSource(source);
          }
          setStatus("Lesson ended");
          emitEvent("lesson_ended", {
            active_seconds: totalActiveSeconds,
            sources: activeSources.map(([sourceName]) => sourceName),
            audio: audioPayload,
          });
        }
      }

      for (const [sourceName, source] of Object.entries(sources)) {
        if (source.loopbackEl) {
          source.loopbackEl.addEventListener("change", () => {
            if (lessonState !== "idle") {
              return;
            }
            source.loopbackTouched = true;
            try {
              localStorage.setItem(`esl_${sourceName}_loopback`, String(source.loopbackEl.checked));
            } catch (e) {}
            // The constraint is applied at capture time, so drop any open stream.
            cleanupSource(source);
            updateModeHint(source);
            emitEvent("loopback_mode_changed", {
              source: sourceName,
              loopback_mode: source.loopbackEl.checked,
            });
          });
        }
        source.select.addEventListener("change", async (event) => {
          if (lessonState !== "idle") {
            return;
          }
          source.selectedDeviceId = event.target.value || "";
          try {
            localStorage.setItem(`esl_${sourceName}_mic`, source.selectedDeviceId);
          } catch (e) {}
          cleanupSource(source);
          checkDeviceConflicts();
          emitEvent("microphone_selected", { source: sourceName, selected_device_id: source.selectedDeviceId || null });
          setStatus("Ready to start");
          errorEl.textContent = "";
          await refreshMicrophones();
        });
      }

      startBtn.addEventListener("click", startLesson);
      pauseBtn.addEventListener("click", () => {
        if (lessonState === "paused") {
          resumeLesson();
        } else {
          pauseLesson();
        }
      });
      stopBtn.addEventListener("click", endLesson);
      document.addEventListener("keydown", (event) => {
        const target = event.target;
        if (event.key !== " " || target.matches("select, input, button")) {
          return;
        }
        event.preventDefault();
        if (lessonState === "recording") {
          pauseLesson();
        } else if (lessonState === "paused") {
          resumeLesson();
        }
      });
      navigator.mediaDevices?.addEventListener?.("devicechange", refreshMicrophones);
      function updateFrameHeight() {
        streamlitBridge.setFrameHeight(document.documentElement.scrollHeight);
      }

      // Floating feedback popup installer on parent document (runs with same-origin privileges)
      function setupParentFeedbackPopup() {
        try {
          const win = window.parent;
          if (!win || !win.document) return;
          const doc = win.document;

          let pop = doc.getElementById("fb-popup");
          if (!pop) {
            pop = doc.createElement("div");
            pop.id = "fb-popup";
            pop.innerHTML = `
              <div class="fb-popup-header">
                <span class="fb-popup-pin-badge">📌 Pinned</span>
                <button type="button" class="fb-popup-close" title="Close (or press Esc)">✕</button>
              </div>
              <div class="fb-popup-body"></div>
            `;
            doc.body.appendChild(pop);
          }

          let currentSentId = null;
          let currentSentEl = null;
          let isPinned = false;
          let hideTimer = null;
          let isMouseOverPopup = false;
          let isMouseOverSent = false;

          const popBody = pop.querySelector(".fb-popup-body");
          const closeBtn = pop.querySelector(".fb-popup-close");

          function clearActivePinnedClass() {
            doc.querySelectorAll(".sent.active-pinned").forEach((el) => {
              el.classList.remove("active-pinned");
            });
          }

          function hide(force = false) {
            if (isPinned && !force) return;
            isPinned = false;
            pop.className = "";
            clearActivePinnedClass();
            currentSentId = null;
            currentSentEl = null;
            if (hideTimer) {
              clearTimeout(hideTimer);
              hideTimer = null;
            }
          }

          function scheduleHide(ms = 350) {
            if (isPinned) return;
            if (hideTimer) clearTimeout(hideTimer);
            hideTimer = setTimeout(() => {
              if (!isMouseOverSent && !isMouseOverPopup && !isPinned) {
                hide();
              }
            }, ms);
          }

          function reposition() {
            if (!currentSentEl || !doc.body.contains(currentSentEl)) return;
            const pane = doc.querySelector(".transcript-pane");
            let box = null;
            if (pane) {
              const r = pane.getBoundingClientRect();
              box = { left: r.left, right: r.right, top: r.top, bottom: r.bottom };
            } else {
              box = { left: 8, right: win.innerWidth - 8, top: 8, bottom: win.innerHeight - 8 };
            }

            const s = currentSentEl.getBoundingClientRect();
            // If the sentence is scrolled completely out of view:
            if (s.bottom < box.top || s.top > box.bottom) {
              if (!isPinned) hide();
              return;
            }

            const pad = 8;
            pop.style.maxWidth = Math.max(260, Math.min(460, box.right - box.left - 2 * pad)) + "px";
            const w = pop.offsetWidth, h = pop.offsetHeight;

            let left = Math.min(Math.max(s.left, box.left + pad), box.right - w - pad);
            let top = s.bottom + 6;
            if (top + h > box.bottom - pad) {
              top = s.top - h - 6;
            }
            top = Math.min(top, box.bottom - h - pad);
            top = Math.max(top, box.top + pad);
            pop.style.left = Math.round(left) + "px";
            pop.style.top = Math.round(top) + "px";
          }

          function show(sent, pin = false) {
            if (hideTimer) {
              clearTimeout(hideTimer);
              hideTimer = null;
            }
            const card = sent.querySelector(".fb-card");
            if (!card) return;

            currentSentEl = sent;
            currentSentId = sent.getAttribute("data-sent-id") || sent.textContent.trim().slice(0, 40);

            if (popBody) {
              popBody.innerHTML = card.innerHTML;
            } else {
              pop.innerHTML = card.innerHTML;
            }

            if (pin) {
              isPinned = true;
              clearActivePinnedClass();
              sent.classList.add("active-pinned");
              pop.className = "show pinned";
            } else {
              if (!isPinned) {
                pop.className = "show";
              }
            }

            reposition();
          }

          // Close button click
          if (closeBtn && !closeBtn.__bound) {
            closeBtn.__bound = true;
            closeBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              hide(true);
            });
          }

          // Mouse entering/leaving popup
          if (!pop.__bound) {
            pop.__bound = true;
            pop.addEventListener("mouseenter", () => {
              isMouseOverPopup = true;
              if (hideTimer) {
                clearTimeout(hideTimer);
                hideTimer = null;
              }
            });
            pop.addEventListener("mouseleave", () => {
              isMouseOverPopup = false;
              scheduleHide(350);
            });
          }

          if (!win.__fbPopupInstalled) {
            win.__fbPopupInstalled = true;

            // Delegated mouseover for sentences
            doc.addEventListener("mouseover", function (e) {
              const t = e.target;
              if (!t || !t.closest) return;
              const sent = t.closest(".sent.flagged, .sent.failed");
              if (sent) {
                isMouseOverSent = true;
                if (!isPinned || sent !== currentSentEl) {
                  show(sent, false);
                }
              }
            }, true);

            // Delegated mouseout for sentences
            doc.addEventListener("mouseout", function (e) {
              const t = e.target;
              if (!t || !t.closest) return;
              const sent = t.closest(".sent.flagged, .sent.failed");
              if (sent) {
                isMouseOverSent = false;
                scheduleHide(350);
              }
            }, true);

            // Delegated click for pinning
            doc.addEventListener("click", function (e) {
              const t = e.target;
              if (!t || !t.closest) return;
              // If click is inside popup, don't dismiss
              if (pop.contains(t)) return;

              const sent = t.closest(".sent.flagged, .sent.failed");
              if (sent) {
                e.preventDefault();
                e.stopPropagation();
                if (isPinned && currentSentEl === sent) {
                  hide(true); // Toggle off if clicked again
                } else {
                  show(sent, true); // Pin it!
                }
                return;
              }

              // Clicked elsewhere on document
              if (isPinned) {
                hide(true);
              }
            }, true);

            // Escape key unpins
            win.addEventListener("keydown", function (e) {
              if (e.key === "Escape") {
                hide(true);
              }
            }, true);

            // Scroll in transcript pane updates position
            doc.addEventListener("scroll", function (e) {
              if (pop.classList.contains("show")) {
                reposition();
              }
            }, true);

            win.addEventListener("resize", function () {
              if (pop.classList.contains("show")) {
                reposition();
              }
            });

            // MutationObserver: Streamlit fragment auto-refreshes every 500ms.
            // When the DOM updates, find the matching sentence and re-anchor!
            const observer = new MutationObserver(function () {
              if (pop.classList.contains("show") && currentSentId) {
                const updatedSent = doc.querySelector(`.sent[data-sent-id="${currentSentId}"]`);
                if (updatedSent) {
                  currentSentEl = updatedSent;
                  if (isPinned) {
                    updatedSent.classList.add("active-pinned");
                  }
                  // Update body content if card changed
                  const card = updatedSent.querySelector(".fb-card");
                  if (card && popBody && popBody.innerHTML !== card.innerHTML) {
                    popBody.innerHTML = card.innerHTML;
                  }
                  reposition();
                } else if (!isPinned && !isMouseOverPopup) {
                  // Only hide if sentence vanished and mouse isn't in popup
                  hide(true);
                }
              }
            });

            observer.observe(doc.body, { childList: true, subtree: true });
          }

          doc.addEventListener("click", (e) => {
            const btn = e.target && e.target.closest ? e.target.closest("#copy-transcript-btn, .copy-transcript-btn") : null;
            if (!btn) return;
            const text = btn.getAttribute("data-transcript") || "";
            if (!text) return;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(text).then(() => {
                const prevHtml = btn.innerHTML;
                btn.innerHTML = "✓ Copied!";
                btn.classList.add("copied");
                setTimeout(() => {
                  btn.innerHTML = prevHtml;
                  btn.classList.remove("copied");
                }, 2000);
              }).catch((err) => {
                console.warn("Clipboard copy failed:", err);
              });
            }
          });
        } catch (e) {
          console.warn("Could not install parent feedback popup:", e);
        }
      }

      streamlitBridge.setComponentReady();
      updateFrameHeight();
      emitEvent("component_ready");
      setStatus("Ready to start");
      setUiState();
      clearWaveform();
      refreshMicrophones();
      setupParentFeedbackPopup();
      new ResizeObserver(updateFrameHeight).observe(document.documentElement);
      setTimeout(updateFrameHeight, 250);
      setTimeout(setupParentFeedbackPopup, 500);
    </script>
  </body>
</html>
