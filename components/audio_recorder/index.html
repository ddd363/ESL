<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        margin: 0;
        font-family: 'Inter', sans-serif;
      }
      #recorder {
        padding: 8px 0;
      }
      #controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #deviceRow {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      #microphone {
        min-width: 240px;
        max-width: 100%;
      }
      #waveform {
        width: 100%;
        max-width: 520px;
        margin-top: 8px;
        background: #f6f7f8;
        border-radius: 6px;
      }
      #error {
        color: #b00020;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="recorder">
      <div id="controls">
        <button id="start" style="padding: 6px 12px;">START</button>
        <button id="stop" style="padding: 6px 12px;" disabled>STOP</button>
        <span id="status">Not recording</span>
      </div>
      <div id="deviceRow">
        <label for="microphone">Microphone</label>
        <select id="microphone">
          <option value="">Default microphone</option>
        </select>
      </div>
      <canvas id="waveform" width="520" height="70"></canvas>
      <div id="error"></div>
    </div>
    <script>
      const streamlitBridge = (() => {
        if (window.Streamlit) {
          return window.Streamlit;
        }

        const post = (type, payload = {}) => {
          window.parent.postMessage(
            {
              isStreamlitMessage: true,
              type,
              ...payload,
            },
            "*"
          );
        };

        return {
          setComponentReady() {
            post("streamlit:componentReady", { apiVersion: 1 });
          },
          setFrameHeight(height) {
            post("streamlit:setFrameHeight", {
              height: height || document.documentElement.scrollHeight || 220,
            });
          },
          setComponentValue(value) {
            post("streamlit:setComponentValue", { value });
          },
        };
      })();

      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");
      const statusEl = document.getElementById("status");
      const errorEl = document.getElementById("error");
      const microphoneSelect = document.getElementById("microphone");
      const canvas = document.getElementById("waveform");
      const ctx = canvas.getContext("2d");

      let audioContext = null;
      let mediaStream = null;
      let processor = null;
      let input = null;
      let analyser = null;
      let animationId = null;
      let micReady = false;
      let micInitPromise = null;
      let recording = false;
      let buffers = [];
      let liveChunkBuffers = [];
      let liveChunkSamples = 0;
      let liveChunkSeq = 0;
      let recordingStartMs = null;
      let timerIntervalId = null;
      let selectedDeviceId = "";
      // 0.5 s keeps one chunk per Streamlit rerun cycle (rerun ≈ 200-300 ms),
      // reducing component-value drops that silence the Deepgram audio pipeline.
      const LIVE_CHUNK_INTERVAL_SECONDS = 0.5;

      function setRecordingUiState() {
        microphoneSelect.disabled = recording;
      }

      function emitEvent(eventName, extra = {}) {
        try {
          streamlitBridge.setComponentValue({
            event: eventName,
            t: Date.now(),
            ...extra,
          });
        } catch (err) {
          // ignore event emission failures
        }
      }

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function formatElapsed(totalSeconds) {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }

      function startTimer() {
        stopTimer();
        recordingStartMs = Date.now();
        timerIntervalId = setInterval(() => {
          if (!recording || !recordingStartMs) {
            return;
          }
          const elapsed = Math.max(0, Math.floor((Date.now() - recordingStartMs) / 1000));
          setStatus(`Recording... ${formatElapsed(elapsed)}`);
        }, 250);
      }

      function stopTimer() {
        if (timerIntervalId) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        recordingStartMs = null;
      }

      function clearWaveform() {
        ctx.fillStyle = "#f6f7f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      function cleanupMic() {
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        if (processor) {
          try {
            processor.disconnect();
          } catch (err) {
            // ignore
          }
          processor = null;
        }
        if (analyser) {
          try {
            analyser.disconnect();
          } catch (err) {
            // ignore
          }
          analyser = null;
        }
        if (input) {
          try {
            input.disconnect();
          } catch (err) {
            // ignore
          }
          input = null;
        }
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => {
            try {
              track.stop();
            } catch (err) {
              // ignore
            }
          });
          mediaStream = null;
        }
        if (audioContext) {
          try {
            audioContext.close();
          } catch (err) {
            // ignore
          }
          audioContext = null;
        }
        micReady = false;
        micInitPromise = null;
      }

      function setMicOptions(devices) {
        const previousValue = selectedDeviceId || microphoneSelect.value || "";
        microphoneSelect.innerHTML = "";
        const defaultOption = document.createElement("option");
        defaultOption.value = "";
        defaultOption.textContent = "Default microphone";
        microphoneSelect.appendChild(defaultOption);

        devices.forEach((device, idx) => {
          const option = document.createElement("option");
          option.value = device.deviceId;
          option.textContent = device.label || `Microphone ${idx + 1}`;
          microphoneSelect.appendChild(option);
        });

        const hasPrevious = devices.some((device) => device.deviceId === previousValue);
        selectedDeviceId = hasPrevious ? previousValue : "";
        microphoneSelect.value = selectedDeviceId;
      }

      async function refreshMicrophones() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
          return;
        }
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          const microphones = devices.filter((device) => device.kind === "audioinput");
          setMicOptions(microphones);
          emitEvent("microphones_listed", {
            count: microphones.length,
            selected_device_id: selectedDeviceId || null,
          });
        } catch (err) {
          emitEvent("microphones_list_error", { message: String(err) });
        }
      }

      function drawWaveform() {
        if (!analyser) {
          return;
        }
        const bufferLength = analyser.fftSize;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteTimeDomainData(dataArray);

        ctx.fillStyle = "#f6f7f8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#2d3a4a";
        ctx.beginPath();

        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i += 1) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 2;
          if (i === 0) {
            ctx.moveTo(x, y);
          } else {
            ctx.lineTo(x, y);
          }
          x += sliceWidth;
        }
        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
        animationId = requestAnimationFrame(drawWaveform);
      }

      async function initMic() {
        if (micReady) {
          return;
        }
        if (micInitPromise) {
          return micInitPromise;
        }
        errorEl.textContent = "";
        micInitPromise = (async () => {
          try {
            setStatus("Requesting mic access...");
            const constraints = selectedDeviceId
              ? { audio: { deviceId: { exact: selectedDeviceId } } }
              : { audio: true };
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === "suspended") {
              await audioContext.resume();
            }
            input = audioContext.createMediaStreamSource(mediaStream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            processor.onaudioprocess = (event) => {
              if (!recording) {
                return;
              }
              const channel = event.inputBuffer.getChannelData(0);
              const chunk = new Float32Array(channel);
              buffers.push(chunk);
              liveChunkBuffers.push(chunk);
              liveChunkSamples += chunk.length;
              flushLiveChunk(false);
            };
            input.connect(analyser);
            analyser.connect(processor);
            processor.connect(audioContext.destination);
            micReady = true;
            setStatus("Ready");
            await refreshMicrophones();
            emitEvent("mic_ready", { sample_rate: audioContext.sampleRate });
          } catch (err) {
            errorEl.textContent = "Microphone access denied or unavailable.";
            setStatus("Not recording");
            emitEvent("mic_error", { message: String(err) });
            micInitPromise = null;
          }
        })();
        return micInitPromise;
      }

      function writeString(view, offset, text) {
        for (let i = 0; i < text.length; i += 1) {
          view.setUint8(offset + i, text.charCodeAt(i));
        }
      }

      function mergeBuffers(chunks) {
        let length = 0;
        chunks.forEach((c) => {
          length += c.length;
        });
        const result = new Float32Array(length);
        let offset = 0;
        chunks.forEach((c) => {
          result.set(c, offset);
          offset += c.length;
        });
        return result;
      }

      function encodeWav(samples, sampleRate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (let i = 0; i < samples.length; i += 1) {
          let s = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
          offset += 2;
        }
        return new Uint8Array(buffer);
      }

      function float32ToPcm16Bytes(samples) {
        const pcm = new Int16Array(samples.length);
        for (let i = 0; i < samples.length; i += 1) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        return new Uint8Array(pcm.buffer);
      }

      function uint8ToBase64(uint8) {
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < uint8.length; i += chunkSize) {
          const chunk = uint8.subarray(i, i + chunkSize);
          binary += String.fromCharCode.apply(null, chunk);
        }
        return btoa(binary);
      }

      function flushLiveChunk(force = false) {
        if (!audioContext) {
          return;
        }
        const sampleRate = audioContext.sampleRate || 44100;
        const thresholdSamples = Math.max(1, Math.floor(sampleRate * LIVE_CHUNK_INTERVAL_SECONDS));
        if (!force && liveChunkSamples < thresholdSamples) {
          return;
        }
        if (!liveChunkBuffers.length) {
          return;
        }
        const merged = mergeBuffers(liveChunkBuffers);
        const pcm16 = float32ToPcm16Bytes(merged);
        if (!pcm16.length) {
          liveChunkBuffers = [];
          liveChunkSamples = 0;
          return;
        }
        streamlitBridge.setComponentValue({
          event: "recording_chunk",
          t: Date.now(),
          seq: liveChunkSeq,
          sample_rate: sampleRate,
          pcm16_base64: uint8ToBase64(pcm16),
        });
        liveChunkSeq += 1;
        liveChunkBuffers = [];
        liveChunkSamples = 0;
      }

      async function startRecording() {
        if (recording) {
          return;
        }
        buffers = [];
        liveChunkBuffers = [];
        liveChunkSamples = 0;
        liveChunkSeq = 0;
        errorEl.textContent = "";
        emitEvent("start_clicked");
        try {
          await initMic();
          if (audioContext && audioContext.state === "suspended") {
            await audioContext.resume();
          }
          recording = true;
          startBtn.disabled = true;
          stopBtn.disabled = false;
          setRecordingUiState();
          setStatus("Recording... 00:00");
          startTimer();
          drawWaveform();
          emitEvent("recording_started", { sample_rate: audioContext ? audioContext.sampleRate : null });
        } catch (err) {
          errorEl.textContent = "Microphone access denied or unavailable.";
          setStatus("Not recording");
          startBtn.disabled = false;
          stopBtn.disabled = true;
          setRecordingUiState();
          emitEvent("recording_start_error", { message: String(err) });
        }
      }

      function stopRecording() {
        if (!recording) {
          return;
        }
        emitEvent("stop_clicked", { buffers: buffers.length });
        recording = false;
        stopTimer();
        startBtn.disabled = false;
        stopBtn.disabled = true;
        setRecordingUiState();
        setStatus("Recording complete");
        if (animationId) {
          cancelAnimationFrame(animationId);
          animationId = null;
        }
        flushLiveChunk(true);
        clearWaveform();
        const sampleRate = audioContext ? audioContext.sampleRate : 44100;
        if (!buffers.length) {
          return;
        }
        const merged = mergeBuffers(buffers);
        const wavBytes = encodeWav(merged, sampleRate);
        const wavBase64 = uint8ToBase64(wavBytes);
        streamlitBridge.setComponentValue({ wav_base64: wavBase64, event: "recording_complete", t: Date.now() });
      }

      microphoneSelect.addEventListener("change", async (event) => {
        if (recording) {
          return;
        }
        selectedDeviceId = event.target.value || "";
        cleanupMic();
        emitEvent("microphone_selected", {
          selected_device_id: selectedDeviceId || null,
        });
        setStatus("Ready to start");
        errorEl.textContent = "";
        await refreshMicrophones();
      });

      startBtn.addEventListener("click", startRecording);
      stopBtn.addEventListener("click", stopRecording);
      navigator.mediaDevices?.addEventListener?.("devicechange", refreshMicrophones);
      streamlitBridge.setComponentReady();
      streamlitBridge.setFrameHeight(200);
      emitEvent("component_ready");
      setStatus("Ready to start");
      setRecordingUiState();
      clearWaveform();
      refreshMicrophones();
      setTimeout(() => streamlitBridge.setFrameHeight(250), 250);
    </script>
  </body>
</html>
